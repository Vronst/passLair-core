[project]
name = "passlair"
version = "0.1.0"
description = "Library to help you build your password manager"
readme = "README.md"
authors = [
    { name = "Adam Sarga", email = "vronst@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mnemonic>=0.21",
    "passlair-crypto",
    "pydantic>=2.13.4",
    "pymysql[rsa]>=1.2.0",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.uv.sources]
passlair-crypto = { git = "https://github.com/Vronst/passLair-crypto", branch = "main" }

[tool.pytest.ini_options]
# Surfaces our logger.debug/info/warning calls in the "Captured log call"
# section pytest attaches to failing tests, without printing anything for
# tests that pass. Use `-o log_cli=true` on the command line to also stream
# logs live while a test is running.
log_level = "DEBUG"
log_format = "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
log_date_format = "%H:%M:%S"
