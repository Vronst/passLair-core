name: Centralized DevOps Pipeline

on:
  push:
    branches: [main, stage]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write # For Job 1 (Labeler) & Job 4 (Auto-PR)
  contents: write # For Job 6 (Releases)
  statuses: write # For commit status checks
  packages: read # For Job 2 (Linter package fetching)
  pages: write # For Job 5 (GitHub Pages deployment)
  id-token: write # For Job 5 (OIDC authentication token)

jobs:
  # 1. PR Labeling: Runs only when PRs are opened/edited
  pr-labeling:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'edited')
    uses: Vronst/workflows/.github/workflows/autolabel.yml@main

  # 2. Linting: Runs on normal branch pushes and PRs
  # Opts Super-Linter into just ruff + mypy (Python; mypy stands in for
  # basedpyright since basedpyright itself isn't one of Super-Linter's
  # linters), markdownlint (Markdown), and Prettier (YAML, the only other
  # Prettier-applicable format in this repo). Setting any VALIDATE_* flips
  # Super-Linter from "run everything detected" into opt-in mode, so leaving
  # the rest unset is what disables them.
  linting:
    if: github.ref_type != 'tag'
    uses: Vronst/workflows/.github/workflows/lint.yml@main
    with:
      # Super-Linter resolves *_CONFIG_FILE names under LINTER_RULES_PATH,
      # which defaults to ".github/linters". Our pyproject.toml lives at
      # the repo root, so without LINTER_RULES_PATH=. below it looks for
      # .github/linters/pyproject.toml, doesn't find it, falls back to the
      # container's own default template (which has no mypy config of that
      # name either), and dies with:
      #   PYTHON_MYPY_LINTER_RULES rules file
      #   (/action/lib/.automation/pyproject.toml) doesn't exist.
      # NOTE: this whole block is echoed verbatim into $GITHUB_ENV by the
      # reusable workflow, so it must contain only KEY=VALUE lines --
      # no "#" comments inside the `linter_env: |` string itself.
      linter_env: |
        VALIDATE_PYTHON_RUFF=true
        VALIDATE_PYTHON_MYPY=true
        PYTHON_MYPY_CONFIG_FILE=pyproject.toml
        VALIDATE_MARKDOWN=true
        VALIDATE_YAML_PRETTIER=true
        LINTER_RULES_PATH=.

  # 3. Testing: Runs on normal branch pushes and PRs
  testing:
    if: github.ref_type != 'tag'
    uses: Vronst/workflows/.github/workflows/test.yml@main
    with:
      runner_type: "local"
      # 90% is a floor below the current ~95% baseline (uv run --with
      # pytest-cov pytest --cov=passlair --cov-report=term-missing), giving
      # headroom for incidental drops while still catching a real regression.
      test_command: "uv run --group test pytest --cov=passlair --cov-report=term-missing --cov-fail-under=90"
      setup_command: |
        pip install uv
        uv sync

  # 4. Auto PR Creation: Runs ONLY on pushes to 'stage' after testing/linting pass successfully
  auto-pr-generation:
    needs: [linting, testing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    uses: Vronst/workflows/.github/workflows/cd.yml@main
    with:
      head: "stage"
      base: "main"
      title: "Automated Release Pipeline: Merge stage into main"
      body: "This PR was automatically generated by the CI pipeline after linting and testing suites cleared successfully."
    secrets:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. Documentation: Runs only when pushing to the main branch
  documentation:
    needs: [linting, testing]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: Vronst/workflows/.github/workflows/docs.yml@main

  # 6. Release Job: Runs ONLY when a version tag is pushed
  release:
    if: github.ref_type == 'tag'
    uses: Vronst/workflows/.github/workflows/release.yml@main
